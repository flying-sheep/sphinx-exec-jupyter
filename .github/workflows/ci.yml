name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  get-environments:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - &CLONE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 #v10.1.0
        with:
          enable-cache: false
      - id: get-envs
        run: |
          ENVS_JSON=$(NO_COLOR=1 uvx hatch env show --json | jq -c 'to_entries
            | map(
              select(.key | startswith("hatch-test"))
              | { name: .key, python: .value.python }
            )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT
  test:
    needs: get-environments
    permissions:
      id-token: write  # for codecov OIDC
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
    env:  # environment variable for use in codecov’s env_vars tagging
      ENV_NAME: ${{ matrix.env.name }}
    steps:
      - *CLONE
      - name: Install UV
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 #v10.1.0
      - name: Install dependencies
        run: uvx hatch -v env create ${{ matrix.env.name }}
      - name: Run tests
        run: |
          uvx hatch run ${{ matrix.env.name }}:run-cov -v --color=yes -n auto --junitxml=test-results.xml
          uvx hatch run ${{ matrix.env.name }}:cov-combine
          uvx hatch run ${{ matrix.env.name }}:coverage xml
          uvx hatch run ${{ matrix.env.name }}:cov-report
      - name: Upload coverage data
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          report_type: coverage
          use_oidc: true
          env_vars: ENV_NAME
          fail_ci_if_error: true
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          env_vars: ENV_NAME
          fail_ci_if_error: true
          files: test-results.xml
  check:
    if: always()
    needs:
      - get-environments
      - test
    runs-on: ubuntu-latest
    steps:
        - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 #v1.3.0
          with:
            jobs: ${{ toJSON(needs) }}
